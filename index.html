<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>osu! Random Profile</title>
    <link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --osu-pink: #ff66aa;
            --osu-blue: #66ccff;
            --bg-dark: #111;
            --bg-panel: #222;
            --text-main: #eee;
            --text-dim: #aaa;
        }

        body {
            margin: 0;
            font-family: 'Exo 2', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            background-image: radial-gradient(circle at top, #222 0%, #111 100%);
        }

        header {
            width: 100%;
            padding: 20px 0;
            text-align: center;
            background: rgba(0,0,0,0.5);
            border-bottom: 2px solid var(--osu-pink);
            box-shadow: 0 0 15px var(--osu-pink);
        }

        h1 { margin: 0; font-style: italic; letter-spacing: 2px; }
        span.highlight { color: var(--osu-pink); }

        .container {
            width: 90%;
            max-width: 800px;
            margin-top: 40px;
        }

        .profile-card {
            background: var(--bg-panel);
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            display: none; /* Oculto por defecto */
            animation: slideIn 0.5s ease-out;
            border: 1px solid #333;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .header-section {
            position: relative;
            height: 150px;
            background: linear-gradient(45deg, var(--osu-pink), var(--osu-blue));
            display: flex;
            align-items: flex-end;
            padding: 20px;
        }

        .avatar-container {
            position: absolute;
            bottom: -50px;
            left: 30px;
            width: 110px;
            height: 110px;
            border: 4px solid var(--bg-panel);
            border-radius: 10px;
            overflow: hidden;
            background: #000;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
        }

        .avatar-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .user-info {
            margin-left: 160px;
            margin-bottom: 10px;
        }

        .username {
            font-size: 2rem;
            font-weight: 700;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
        }

        .country {
            font-size: 1rem;
            color: #fff;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 20px;
            padding: 70px 30px 30px;
        }

        .stat-box {
            background: rgba(255,255,255,0.05);
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            border-bottom: 3px solid var(--osu-blue);
        }

        .stat-label {
            font-size: 0.9rem;
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .stat-value {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text-main);
            margin-top: 5px;
        }

        .controls {
            margin-top: 30px;
            margin-bottom: 50px;
            text-align: center;
        }

        button {
            background: var(--osu-pink);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.2rem;
            font-family: 'Exo 2', sans-serif;
            font-weight: 700;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 0 10px var(--osu-pink);
            text-transform: uppercase;
        }

        button:hover {
            transform: scale(1.05);
            background: #ff85bc;
            box-shadow: 0 0 20px var(--osu-pink);
        }
        
        button:disabled {
            background: #555;
            cursor: not-allowed;
            box-shadow: none;
            transform: none;
        }

        .loader {
            border: 4px solid #333;
            border-top: 4px solid var(--osu-pink);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
            display: none;
        }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        .error-msg { 
            color: #ff66aa; 
            text-align: center; 
            margin-top: 20px; 
            display: none; 
            background: rgba(255, 102, 170, 0.1);
            padding: 15px;
            border-radius: 8px;
        }
    </style>
</head>
<body>

    <header>
        <h1>osu! <span class="highlight">Random</span> Finder</h1>
    </header>

    <div class="container">
        <div id="loader" class="loader"></div>
        <div id="error-msg" class="error-msg"></div>

        <div id="profile-card" class="profile-card">
            <div class="header-section">
                <div class="avatar-container">
                    <img id="user-avatar" src="" alt="Avatar">
                </div>
                <div class="user-info">
                    <div class="username" id="user-name">Loading...</div>
                    <div class="country" id="user-country">
                        <span id="country-flag">🏳️</span> <span id="country-name">Unknown</span>
                    </div>
                </div>
            </div>

            <div class="stats-grid">
                <div class="stat-box">
                    <div class="stat-label">Global Rank</div>
                    <div class="stat-value" id="stat-rank">#-</div>
                </div>
                <div class="stat-box">
                    <div class="stat-label">Country Rank</div>
                    <div class="stat-value" id="stat-country-rank">#-</div>
                </div>
                <div class="stat-box">
                    <div class="stat-label">PP (Performance)</div>
                    <div class="stat-value" id="stat-pp">0</div>
                </div>
                <div class="stat-box">
                    <div class="stat-label">Accuracy</div>
                    <div class="stat-value" id="stat-acc">0%</div>
                </div>
                <div class="stat-box">
                    <div class="stat-label">Level</div>
                    <div class="stat-value" id="stat-level">0</div>
                </div>
                <div class="stat-box">
                    <div class="stat-label">Play Count</div>
                    <div class="stat-value" id="stat-plays">0</div>
                </div>
            </div>
            
            <div style="text-align: center; padding-bottom: 20px;">
                <a id="profile-link" href="#" target="_blank" style="color: var(--osu-blue); text-decoration: none; font-weight: bold;">Ver perfil oficial &rarr;</a>
            </div>
        </div>
    </div>

    <div class="controls">
        <button id="btn-fetch">Siguiente Aleatorio</button>
        <p style="color: #666; font-size: 0.8rem; margin-top: 10px;">Presiona ESPACIO para buscar</p>
    </div>

    <script>
        const btnFetch = document.getElementById('btn-fetch');
        const profileCard = document.getElementById('profile-card');
        const loader = document.getElementById('loader');
        const errorMsg = document.getElementById('error-msg');
        
        // Elementos del DOM
        const els = {
            avatar: document.getElementById('user-avatar'),
            name: document.getElementById('user-name'),
            flag: document.getElementById('country-flag'),
            country: document.getElementById('country-name'),
            rank: document.getElementById('stat-rank'),
            countryRank: document.getElementById('stat-country-rank'),
            pp: document.getElementById('stat-pp'),
            acc: document.getElementById('stat-acc'),
            level: document.getElementById('stat-level'),
            plays: document.getElementById('stat-plays'),
            link: document.getElementById('profile-link')
        };

        async function fetchRandomUser() {
            // Reset UI
            profileCard.style.display = 'none';
            errorMsg.style.display = 'none';
            loader.style.display = 'block';
            btnFetch.disabled = true;
            btnFetch.textContent = "Buscando...";

            try {
                const response = await fetch('/api/random-user');
                
                if (!response.ok) {
                    const errData = await response.json().catch(() => ({}));
                    throw new Error(errData.error || `Error HTTP: ${response.status}`);
                }
                
                const data = await response.json();

                if (data.error) throw new Error(data.error);
                if (!data.id) throw new Error('Datos inválidos recibidos');

                // 1. Datos básicos
                els.avatar.src = `https://a.ppy.sh/${data.id}?${Date.now()}`; // Cache buster
                els.name.textContent = data.username;
                
                // Manejo seguro del país
                let countryCode = '';
                if (typeof data.country === 'string') {
                    countryCode = data.country;
                } else if (data.country && data.country.code) {
                    countryCode = data.country.code;
                }
                
                els.country.textContent = countryCode || 'Unknown';
                els.flag.textContent = getFlagEmoji(countryCode);

                // 2. Estadísticas (Lógica robusta)
                // La API v2 devuelve statistics directamente si pedimos /users/{id}/osu
                const stats = data.statistics || {};

                const globalRank = stats.global_rank || 0;
                const countryRank = stats.country_rank || 0;
                const pp = stats.pp || 0;
                const hitAccuracy = stats.hit_accuracy || 0;
                const levelValue = stats.level;
                const level = typeof levelValue === 'object' && levelValue !== null
                    ? (levelValue.current || 0)
                    : (levelValue || 0);
                const playCount = stats.play_count || 0;

                // Formateo y asignación
                els.rank.textContent = globalRank > 0 ? '#' + globalRank.toLocaleString() : '#-';
                els.countryRank.textContent = countryRank > 0 ? '#' + countryRank.toLocaleString() : '#-';
                els.pp.textContent = Math.round(pp).toLocaleString();
                els.acc.textContent = hitAccuracy.toFixed(2) + '%';
                els.level.textContent = Math.round(level).toLocaleString();
                els.plays.textContent = playCount.toLocaleString();
                
                els.link.href = `https://osu.ppy.sh/users/${data.id}`;

                // Mostrar tarjeta con animación
                loader.style.display = 'none';
                profileCard.style.display = 'block';
                btnFetch.textContent = "Siguiente Aleatorio";

            } catch (err) {
                console.error(err);
                loader.style.display = 'none';
                errorMsg.textContent = "Error: " + err.message;
                errorMsg.style.display = 'block';
                btnFetch.textContent = "Reintentar";
            } finally {
                btnFetch.disabled = false;
            }
        }

        function getFlagEmoji(countryCode) {
            if (!countryCode) return '🏳️';
            try {
                const codePoints = countryCode.toUpperCase().split('').map(char => 127397 + char.charCodeAt());
                return String.fromCodePoint(...codePoints);
            } catch (e) {
                return '🏳️';
            }
        }

        // Event Listeners
        btnFetch.addEventListener('click', fetchRandomUser);
        
        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space' && !btnFetch.disabled) {
                e.preventDefault(); // Evitar scroll
                fetchRandomUser();
            }
        });
        
        // Cargar uno al inicio
        fetchRandomUser();
    </script>
</body>
</html>
